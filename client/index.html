<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C2410C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>IGNITE</title>
    <script>
      // Light or dark, decided before the page draws so it never flashes the
      // wrong colours. The saved choice is 'device' (the default), 'light' or
      // 'dark'; ThemeToggle.jsx changes it later. Keep the key the same there.
      ;(function () {
        var choice = 'device'
        try {
          choice = localStorage.getItem('ignite:theme') || 'device'
        } catch (e) {}
        var deviceIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = choice === 'dark' || (choice !== 'light' && deviceIsDark)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
